{% extends 'base.html' %}
{% block title %}TDG Luxury — TDG Command Center{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-2">
  <div>
    <div class="page-title">TDG Luxury</div>
    <div class="page-subtitle">Residential closings at $750,000 or more — monthly year-over-year</div>
  </div>
</div>

<div class="card">
  <div class="card-body p-3 p-md-4">
    <div style="position:relative;height:420px;min-height:320px;">
      <canvas id="luxuryChart" aria-label="TDG Luxury monthly closed units by year" role="img"></canvas>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const luxuryData = {
  labels: {{ chart_labels | tojson }},
  datasets: {{ chart_datasets | tojson }}
};

new Chart(document.getElementById('luxuryChart'), {
  type: 'line',
  data: luxuryData,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: {
        position: 'bottom',
        labels: { usePointStyle: true, boxWidth: 9, padding: 18 }
      },
      tooltip: {
        callbacks: {
          label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y} closing${ctx.parsed.y === 1 ? '' : 's'}`
        }
      },
      datalabels: { display: false }
    },
    scales: {
      y: {
        beginAtZero: true,
        ticks: { precision: 0, stepSize: 1 },
        title: { display: true, text: 'Closed Units' },
        grid: { color: '#eef0f3' }
      },
      x: { grid: { display: false } }
    }
  }
});
</script>
{% endblock %}
