{% extends 'base.html' %}
{% block title %}Ask — TDG Command Center{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <div class="page-title">Ask TDG</div>
    <div class="page-subtitle">Ask anything about your deals, agents, and performance</div>
  </div>
</div>

<!-- Chat window -->
<div class="card" style="height: calc(100vh - 260px); min-height: 400px; display: flex; flex-direction: column;">
  <div class="card-body d-flex flex-column p-0" style="overflow:hidden;">
    <!-- Messages -->
    <div id="chat-messages" style="flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:0.75rem;">
      <div class="d-flex gap-2 align-items-start">
        <div style="width:32px;height:32px;background:var(--tdg-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.8rem;flex-shrink:0;">J</div>
        <div style="background:var(--tdg-bg);border:1px solid var(--tdg-border);border-radius:12px 12px 12px 2px;padding:0.75rem 1rem;max-width:85%;font-size:0.875rem;">
          Hi! I'm Jet. Ask me anything about TDG's deals, agents, or performance.
        </div>
      </div>
    </div>
    <!-- Input -->
    <div style="border-top:1px solid var(--tdg-border);padding:0.75rem 1rem;">
      <div class="d-flex gap-2">
        <input type="text" id="ask-input" class="form-control" placeholder="Ask anything..." autocomplete="off">
        <button class="btn btn-gold px-3" id="ask-btn" onclick="sendQuestion()">
          <i class="bi bi-send"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<script>

let chatHistory = [];  // {role: 'user'|'assistant', text: string}

function addMessage(text, isUser) {
  const chat = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'd-flex gap-2 align-items-start' + (isUser ? ' flex-row-reverse' : '');
  div.innerHTML = isUser
    ? `<div style="background:var(--tdg-gold);border:1px solid var(--tdg-border);border-radius:12px 12px 2px 12px;padding:0.75rem 1rem;max-width:85%;font-size:0.875rem;color:#fff;">${text}</div>`
    : `<div style="width:32px;height:32px;background:var(--tdg-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.8rem;flex-shrink:0;">J</div>
       <div style="background:var(--tdg-bg);border:1px solid var(--tdg-border);border-radius:12px 12px 12px 2px;padding:0.75rem 1rem;max-width:85%;font-size:0.875rem;">${text}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const chat = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.id = 'typing-indicator';
  div.className = 'd-flex gap-2 align-items-start';
  div.innerHTML = `
    <div style="width:32px;height:32px;background:var(--tdg-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.8rem;flex-shrink:0;">J</div>
    <div style="background:var(--tdg-bg);border:1px solid var(--tdg-border);border-radius:12px 12px 12px 2px;padding:0.75rem 1rem;font-size:0.875rem;color:var(--tdg-muted);">
      <span class="spinner-border spinner-border-sm me-2" style="width:12px;height:12px;"></span>Thinking...
    </div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendQuestion() {
  const input = document.getElementById('ask-input');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  addMessage(q, true);
  addTyping();
  document.getElementById('ask-btn').disabled = true;

  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q, history: chatHistory})
    });
    const data = await resp.json();
    removeTyping();
    const answer = data.answer || 'No answer returned.';
    addMessage(answer, false);
    chatHistory.push({role: 'user', text: q});
    chatHistory.push({role: 'assistant', text: answer});
    // Keep history from growing unbounded — last 12 messages (6 exchanges) is plenty of context
    if (chatHistory.length > 12) chatHistory = chatHistory.slice(-12);
  } catch(e) {
    removeTyping();
    addMessage('Sorry, something went wrong. Try again.', false);
  }
  document.getElementById('ask-btn').disabled = false;
  input.focus();
}

document.getElementById('ask-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendQuestion();
});
</script>
{% endblock %}
