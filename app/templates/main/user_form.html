{% extends 'base.html' %}
{% block title %}Add User{% endblock %}
{% block content %}
<div class="page-title">Add User</div>
<div class="page-subtitle">Create a staff login</div>
<div class="card" style="max-width:450px">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3"><label class="form-label">Username *</label><input type="text" name="username" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email *</label><input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Password *</label><input type="password" name="password" class="form-control" required></div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role" class="form-select">
          <option>staff</option><option>admin</option>
        </select>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-gold">Create User</button>
        <a href="{{ url_for('main.users') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
