{% extends 'base.html' %}
{% block title %}{{ 'Edit' if agent else 'Add' }} Agent{% endblock %}
{% block content %}
<div class="page-title">{{ 'Edit' if agent else 'Add' }} Agent</div>
<div class="page-subtitle">Team roster entry</div>
<div class="card" style="max-width:600px">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-8"><label class="form-label">Full Name *</label><input type="text" name="name" class="form-control" required value="{{ agent.name if agent else '' }}"></div>
        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select name="status" class="form-select">
            {% for s in ['Active','Inactive'] %}<option {% if agent and agent.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Role</label>
          <select name="role" class="form-select">
            {% for r in ['Both L/B','Lead Agent','Buyer Agent','Listing Agent'] %}<option {% if agent and agent.role==r %}selected{% endif %}>{{ r }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Type</label>
          <select name="agent_type" class="form-select">
            {% for t in ['Individual','Team'] %}<option {% if agent and agent.agent_type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-4"><label class="form-label">Split %</label><input type="number" name="split_pct" class="form-control" step="0.1" value="{{ (agent.split_pct*100)|round(1) if agent else 0 }}"></div>
        <div class="col-md-4"><label class="form-label">Cap Amount ($)</label><input type="number" name="cap_amount" class="form-control" step="0.01" value="{{ agent.cap_amount if agent else 0 }}"></div>
        <div class="col-md-4">
          <label class="form-label">Start Month</label>
          <select name="start_month" class="form-select">
            {% for m in range(1,13) %}<option value="{{ m }}" {% if agent and agent.start_month==m %}selected{% endif %}>{{ m }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-12"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ agent.email if agent else '' }}"></div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-gold">{{ 'Update' if agent else 'Save Agent' }}</button>
          <a href="{{ url_for('main.agents') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
