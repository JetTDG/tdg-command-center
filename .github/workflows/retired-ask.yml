name: Retired Ask surface
on: [push, pull_request]
permissions:
  contents: read
jobs:
  retired-ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact source before release
        run: python scripts/check_retired_ask.py .
      - name: Prove restoration detection
        run: python -m unittest discover -s tests -p test_retired_ask_source_guard.py -v
